# FFT multiplayer fork: Windows x64 build only, to keep private-repo Actions minutes low.
# Download the result from the run's "Artifacts" section on the Actions tab.
name: FFT Windows build

on:
  push:
    branches:
    - main
    paths-ignore:
    - '*.md'
    - 'fft/**'
    - '.github/**'
  workflow_dispatch:

concurrency:
  group: fft-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Create git-version.cpp
      shell: pwsh
      run: |
        $short = "${{ github.sha }}".Substring(0, 7)
        $ver = "v1.20.4-fft-$short"
        echo "const char *PPSSPP_GIT_VERSION = `"$ver`";" > git-version.cpp
        echo "#define PPSSPP_GIT_VERSION_NO_UPDATE 1" >> git-version.cpp

    - name: Build PPSSPP (x64 Release)
      run: msbuild /m /p:TrackFileAccess=false /p:Configuration=Release /p:Platform=x64 Windows/PPSSPP.sln

    - name: Package
      shell: pwsh
      run: |
        mkdir ppsspp-fft
        cp PPSSPP*.exe ppsspp-fft/
        cp Windows/*.bat ppsspp-fft/
        cp -r assets ppsspp-fft/assets
        cp fft/PLAYTEST.md ppsspp-fft/ -ErrorAction SilentlyContinue

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: ppsspp-fft-windows-x64
        path: ppsspp-fft/
        retention-days: 30
